<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentación Comunitaria: Cuidemos lo Nuestro | José C. Paz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #004b93;
      --primary-dark: #002e5b;
      --accent: #ffbf00;
      --danger: #b91c1c;
      --safe: #15803d;
      --bg: #0c1a30;
      --text: #ffffff;
      --card-bg: #132743;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      user-select: none;
    }

    /* Barra superior de navegación del orador */
    .slide-nav {
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      padding: 0.75rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid rgba(255, 255, 255, 0.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .slide-nav__title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
    }

    .slide-nav__counter {
      font-size: 1.25rem;
      font-weight: 900;
      background: var(--primary);
      padding: 0.25rem 0.85rem;
      border-radius: 999px;
    }

    .slide-nav__buttons {
      display: flex;
      gap: 0.5rem;
    }

    .nav-btn {
      background: #ffffff;
      color: #000000;
      border: none;
      font-weight: 900;
      font-size: 1.1rem;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: transform 0.1s, background-color 0.2s;
    }

    .nav-btn:hover {
      background: var(--accent);
    }

    .nav-btn:active {
      transform: scale(0.96);
    }

    /* Contenedor principal de la diapositiva */
    .slide-viewport {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .slide-card {
      background: var(--card-bg);
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      width: 100%;
      max-width: 1100px;
      min-height: 580px;
      padding: 3.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      position: relative;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .slide-tag {
      display: inline-block;
      background: var(--primary);
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.4rem 1rem;
      border-radius: 999px;
      margin-bottom: 1.5rem;
      width: fit-content;
    }

    .slide-tag--alert {
      background: var(--danger);
    }

    .slide-tag--safe {
      background: var(--safe);
    }

    .slide-tag--interactive {
      background: var(--accent);
      color: #000000;
    }

    .slide-title {
      font-size: 3rem;
      line-height: 1.2;
      font-weight: 900;
      margin-bottom: 1.5rem;
      color: #ffffff;
    }

    .slide-title span {
      color: var(--accent);
    }

    .slide-body {
      font-size: 1.85rem;
      line-height: 1.45;
      color: #e2e8f0;
      margin-bottom: 2rem;
    }

    .slide-points {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .slide-point {
      font-size: 1.7rem;
      line-height: 1.4;
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      background: rgba(255, 255, 255, 0.05);
      padding: 1.25rem 1.5rem;
      border-radius: 14px;
      border-left: 6px solid var(--accent);
    }

    .slide-point--danger {
      border-left-color: var(--danger);
      background: rgba(185, 28, 28, 0.15);
    }

    .slide-point--safe {
      border-left-color: var(--safe);
      background: rgba(21, 128, 61, 0.15);
    }

    .slide-icon {
      font-size: 2.2rem;
      line-height: 1;
    }

    /* Notas del orador */
    .speaker-notes-drawer {
      background: #060d1a;
      border-top: 2px dashed #ffbf00;
      padding: 1rem 2rem;
      font-size: 1.15rem;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .speaker-notes-drawer strong {
      color: var(--accent);
      font-size: 1.2rem;
    }

    /* Responsividad para proyectores chicos o notebooks */
    @media (max-width: 768px) {
      .slide-card {
        padding: 1.5rem;
        min-height: auto;
      }
      .slide-title {
        font-size: 2rem;
      }
      .slide-body, .slide-point {
        font-size: 1.25rem;
      }
    }
  </style>
</head>

    let currentSlide = 0;

    const slideContainer = document.getElementById('slide-container');
    const slideIndicator = document.getElementById('slide-indicator');
    const speakerText = document.getElementById('speaker-text');
    const speakerNotes = document.getElementById('speaker-notes');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnToggleNotes = document.getElementById('btn-toggle-notes');

    function renderSlide(index) {
      const data = slides[index];

      let pointsHtml = '';
      if (data.points && data.points.length > 0) {
        pointsHtml = `
          <ul class="slide-points">
            ${data.points.map(p => `
              <li class="slide-point ${p.cls}">
                <span class="slide-icon">${p.icon}</span>
                <span>${p.text}</span>
              </li>
            `).join('')}
          </ul>
        `;
      }

      slideContainer.innerHTML = `
        <span class="slide-tag ${data.tagClass}">${data.tag}</span>
        <h2 class="slide-title">${data.title}</h2>
        <p class="slide-body">${data.body}</p>
        ${pointsHtml}
      `;

      slideIndicator.textContent = `${index + 1} / ${slides.length}`;
      speakerText.textContent = data.notes;

      btnPrev.disabled = index === 0;
      btnNext.disabled = index === slides.length - 1;
    }

    btnPrev.addEventListener('click', () => {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide(currentSlide);
      }
    });

    btnNext.addEventListener('click', () => {
      if (currentSlide < slides.length - 1) {
        currentSlide++;
        renderSlide(currentSlide);
      }
    });

    btnToggleNotes.addEventListener('click', () => {
      speakerNotes.style.display = speakerNotes.style.display === 'none' ? 'flex' : 'none';
    });

    // Control con teclado para el proyector (Flechas Izquierda / Derecha / Espacio)
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        if (currentSlide < slides.length - 1) {
          currentSlide++;
          renderSlide(currentSlide);
        }
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        if (currentSlide > 0) {
          currentSlide--;
          renderSlide(currentSlide);
        }
      }
    });

    // Iniciar con la primera diapositiva
    renderSlide(currentSlide);
  </script>
